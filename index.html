  <!-- Google Analytics 4 — Consent Mode v2 defaults -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Consent Mode v2: default ALL consent signals to 'denied'.
    // GDPR/ePrivacy requires opt-in before any non-essential cookies.
    // The React CookieConsent component will call gtag('consent','update',…)
    // once the user interacts with the banner (or restores from localStorage).
    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'analytics_storage': 'denied',
      'functionality_storage': 'granted',
      'security_storage': 'granted',
      'wait_for_update': 500
    });

    // Restore previously saved consent from localStorage (before tags fire).
    // This runs synchronously so returning visitors get their choice applied
    // before the gtag config call below, avoiding any cookieless pings.
    (function() {
      try {
        var saved = JSON.parse(localStorage.getItem('vistream_cookie_consent'));
        if (saved && saved.version === 1) {
          gtag('consent', 'update', {
            'analytics_storage': saved.analytics ? 'granted' : 'denied',
            'ad_storage': saved.marketing ? 'granted' : 'denied',
            'ad_user_data': saved.marketing ? 'granted' : 'denied',
            'ad_personalization': saved.marketing ? 'granted' : 'denied'
          });
        }
      } catch(e) {}
    })();
  </script>
